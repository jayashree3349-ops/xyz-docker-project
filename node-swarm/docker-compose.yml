services:
  web:
    image: xyz-web:1.0.0
    build: ./web
    ports:
      - "8080:80"
    networks:
      - frontend
    depends_on:
      - api
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first

  api:
    image: xyz-api:1.0.0
    build: ./api
    environment:
      DB_HOST: db
      DB_NAME: xyzdb
      DB_USER: xyzuser
      DB_PASSWORD: xyzpass
    networks:
      - frontend
      - backend
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: xyzdb
      POSTGRES_USER: xyzuser
      POSTGRES_PASSWORD: xyzpass
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

networks:
  frontend:
    driver: overlay
  backend:
    driver: overlay
    internal: true

volumes:
  pgdata:
