apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: restrict-service-b
  namespace: xyz-network-isolation
spec:
  podSelector:
    matchLabels:
      app: service-b
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: service-a
        - podSelector:
            matchLabels:
              role: allowed-client
      ports:
        - protocol: TCP
          port: 8080
