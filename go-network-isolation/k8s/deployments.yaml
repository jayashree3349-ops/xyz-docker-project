apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-a
  namespace: xyz-network-isolation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-a
  template:
    metadata:
      labels:
        app: service-a
        role: allowed-client
    spec:
      containers:
        - name: service-a
          image: jayashree0009/xyz-service-a:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: service-a
  namespace: xyz-network-isolation
spec:
  selector:
    app: service-a
  ports:
    - port: 8080
      targetPort: 8080
---
