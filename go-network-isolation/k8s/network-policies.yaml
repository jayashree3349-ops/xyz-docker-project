apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: isolate-service-c
  namespace: xyz-network-isolation
spec:
  podSelector:
    matchLabels:
      app: service-c
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: service-c
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: service-c
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
